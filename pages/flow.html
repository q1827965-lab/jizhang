<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>流水</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2563EB">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../vendor/flatpickr/flatpickr.min.css">
</head>
<body>
<div class="phone phone--flow">
  <div class="scroll" id="scroll"></div>
  <nav class="nav" aria-label="底部导航"></nav>
</div>
<script src="../js/png-data.js"></script>
  <script src="../js/calc.js"></script>
<script src="../js/store.js"></script>
<script src="../vendor/flatpickr/flatpickr.min.js"></script>
<script src="../vendor/flatpickr/zh.js"></script>
<script src="../js/ui.js"></script>
<script>
(function () {
  var S = Store.state();
  var date = UI.qs('date') || S.today;

  document.querySelector('.nav').outerHTML = UI.nav('flow');
  var root = document.getElementById('scroll');

  function render() {
    var S = Store.state();
    // 同一天可以有上周期支出和新周期工资，按实际日期展示全部收支。
    var list = (S.entries || []).filter(function (e) { return e.date === date; });
    list.sort(function (a, b) { return (a.time || '').localeCompare(b.time || ''); });

    var totals = Calc.entryTotals(list);
    var byEnv = {};
    list.forEach(function (e) {
      if (e.envelope === 'income') return;
      byEnv[e.envelope] = Calc.round2((byEnv[e.envelope] || 0) + e.amount);
    });
    var envNames = { food: '吃饭', sub: '固定订阅', taxi: '机动', other: '机动·其他', free: '自由支配', emergency: '应急金' };
    var envChips = Object.keys(byEnv).map(function (k) {
      return '<span class="tag">' + (envNames[k] || k) + ' ' + Calc.num(byEnv[k]) + '</span>';
    }).join('');

    var rows = list.map(function (e) {
      return '<div class="flow-item">' +
        '<div class="flow-item__b">' +
          '<div class="flow-item__n">' + UI.esc(e.catName) + '</div>' +
        '</div>' +
        '<div class="flow-item__a">' + (e.amount < 0 ? '+' + Calc.num(-e.amount) : UI.signed(e.amount)) + '</div>' +
        '<a class="item-row__edit" href="review-entry.html?id=' + encodeURIComponent(e.id) + '" aria-label="' + (e.pending ? '拆分待核对' : '编辑流水') + '">' + UI.icon('edit', 14) + '</a>' +
        '<button type="button" class="item-row__edit" data-del="' + e.id + '" aria-label="删除">' + UI.icon('close', 14) + '</button>' +
        '</div>';
    }).join('');

    root.innerHTML =
      '<h1 style="margin:0;font-size:24px;font-weight:700">流水</h1>' +

      '<div class="date-nav">' +
        '<button type="button" class="icon-btn" data-nav="-1" aria-label="前一天">' + UI.icon('left', 18) + '</button>' +
        UI.datePicker('pickDate', date, { className: 'date-nav__mid' }) +
        '<button type="button" class="icon-btn" data-nav="1" aria-label="后一天">' + UI.icon('right', 18) + '</button>' +
      '</div>' +

      '<section class="card">' +
        '<div class="row-between" style="align-items:baseline">' +
          '<span class="card-label">' + (totals.net >= 0 ? '当日净收入' : '当日净支出') + '</span>' +
          '<span style="font-size:28px;font-weight:700">' + UI.money(Math.abs(totals.net)) + '</span>' +
        '</div>' +
        '<div class="row-between"><span>收入 ' + UI.money(totals.income) + '</span><span>支出 ' + UI.money(totals.expense) + '</span></div>' +
        (envChips ? '<div class="chips">' + envChips + '</div>' : (list.length ? '' : '<div class="hint">这天还没有记账</div>')) +
      '</section>' +

      '<section class="card card--flush">' + (rows || '<div class="hint" style="padding:14px 0">没有记录</div>') + '</section>' +

      '<div class="spacer"></div>' +
      '<a class="btn btn--lg btn--block flow-add" id="addEntry" href="' + UI.url('add.html') + '?date=' + date + '">' +
        UI.icon('plus', 20, '#fff') + '记一笔</a>';

    UI.onDateChange(root, '#pickDate', function (value) { date = value; render(); });

    UI.on(root, '[data-nav]', 'click', function (el) {
      date = Calc.addDays(date, Number(el.getAttribute('data-nav')));
      render();
    });

    UI.on(root, '[data-del]', 'click', function (el) {
    var id = el.getAttribute('data-del');
      /* 第 8 节：删除一笔带已买记录的支出时，先问要不要放回排表 */
      var rec = Store.boughtRecordOf(Store.state(), id);
      if (rec) {
    var back = confirm('这笔是「' + rec.name + '」买下来的（估计 ' + UI.money(rec.estimate) +
          '，实际 ' + UI.money(rec.actual) + '）。\n要把 ' + rec.name + ' 放回排表吗？');
        Store.removeEntry(id);
if (back) {
      /* 第 8 节：按快照原样恢复（id / 置顶 / 希望在哪个周期前买到等），
         keepEstimate 表示金额也用排表里的估计值，不改成实际花掉的 */
          Store.restoreToPlan(id, { keepEstimate: true });
          UI.toast('已把 ' + rec.name + ' 放回排表');
        } else {
      UI.toast('已删除，' + rec.name + ' 不放回排表');
        }
        render();
        return;
      }
      if (!confirm('删掉这一笔？' + ((Store.state().entries || []).some(function (e) { return e.id === id && e.amount < 0; })
        ? '这笔收入会从入账账户扣回。' : '账户余额会退回去。'))) return;
      Store.removeEntry(id);
      if (!Store.lastWriteOk()) return;
      render();
      UI.toast('已删除');
    });
  }

  render();
})();
</script>
</body>
</html>
