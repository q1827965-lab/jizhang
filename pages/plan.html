<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2563EB">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="phone">
  <div class="scroll scroll--tight" id="scroll"></div>
  <nav class="nav" aria-label="底部导航"></nav>
</div>
<script src="../js/png-data.js"></script>
  <script src="../js/calc.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ui.js"></script>
<script>
(function () {
  document.querySelector('.nav').outerHTML = UI.nav('plan');
  var root = document.getElementById('scroll');

  function render() {
    var S = Store.state();
    var pv = Calc.planView(S, { horizon: 6 });
    var fc = pv.forecast;

    var schedRows = pv.scheduled.map(function (it) {
      return UI.itemRow({ id: it.id, name: it.name, amount: it.amount, label: it.label });
    }).join('') || '<div class="hint" style="padding:10px 0">还没有排定项</div>';

    var condRows = pv.conditional.map(function (it) {
      return UI.itemRow({
        id: it.id, name: it.name, amount: it.amount,
        badge: it.badge, badgeTone: it.badgeTone, pinnable: true, pinned: it.pinned
      });
    }).join('') || '<div class="hint" style="padding:10px 0">还没有条件项</div>';

    var willNeg = fc.willGoNegative;
    var negList = pv.negativeCycles || [];

    root.innerHTML =
      '<div class="topbar topbar--center">' +
        '<h1>排表</h1>' +
        '<a class="btn btn--outline btn--sm" href="' + UI.url('buy.html') + '">买不买？</a>' +
      '</div>' +

      '<section class="card">' +
        '<div class="row-between" style="align-items:flex-end">' +
          '<div><div class="card-label">自由支配余额</div>' +
            '<div class="card-value card-value--md">' + UI.money(pv.freeBalance) + '</div></div>' +
          '<div class="text-right"><div class="section-note">安全可花</div>' +
            '<div style="font-size:18px;font-weight:700' + (pv.safeSpend <= 0 ? ';color:var(--orange)' : '') + '">' +
            UI.money(pv.safeSpend) + '</div></div>' +
    '</div>' +
        UI.barChart(fc.rows, fc.floor) +
        /* 负数周期：差多少、差哪几项，都写出来（第 8 节） */
        (negList ? negList.map(function (n) {
          return '<div class="neg-note"><span class="neg-note__t">' + UI.esc(n.label) +
            '排定项差 ' + UI.money(n.gap) + '</span>' +
            '<span class="neg-note__d">这个周期要付：' + UI.esc(n.scheduledNames.join('、')) +
            '（合计 ' + UI.money(n.scheduledAmount) + '）</span></div>';
        }).join('') : '') +
        '<div class="section-note">柱子 = 排定项照付、标为可买的条件项都买了之后，各周期的最低余额 · 虚线为底线 ' + UI.num(fc.floor) +
          (willNeg ? ' · <b style="color:var(--red)">有周期会变负，排定项排不开</b>' : '') + '</div>' +
      '</section>' +

      '<section class="card card--tight">' +
        '<div class="row-between" style="align-items:baseline">' +
          '<span class="section-title">排定项</span>' +
          '<span class="section-note">' + pv.scheduled.length + ' 项 · 到期直接扣 · 可上下滑动</span>' +
        '</div>' +
        '<div class="list-box">' + schedRows + '</div>' +
      '</section>' +

      '<section class="card card--tight">' +
        '<div class="row-between" style="align-items:baseline">' +
          '<span class="section-title">条件项</span>' +
          '<span class="section-note">' + pv.conditional.length + ' 项 · 置顶优先 · 最贵优先</span>' +
        '</div>' +
        '<div class="list-box">' + condRows + '</div>' +
      '</section>';

    /* 规格第 8 节：只有编辑图标可点，行本身无反应 */
    UI.on(root, '[data-edit]', 'click', function (el) {
      UI.go('edit-item.html', { id: el.getAttribute('data-edit') });
    });
    UI.on(root, '[data-pin]', 'click', function (el) {
      Store.togglePin(el.getAttribute('data-pin'));
      render();
      UI.toast('置顶已切换，排序会重算');
    });
  }

  render();
})();
</script>
</body>
</html>
